<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plan Builder | Interaction Lab</title><link rel="stylesheet" href="style.css"></head><body><header><div class="wrap"><h1>Plan Builder</h1><nav><a href="index.html">Home</a><a href="quantity.html">Quantity Setup</a><a href="navigator.html">Resource Navigator</a></nav></div></header><main><h2>Customize your plan</h2><div class="card"><h3>Monthly budget</h3><p>$250 to $1,000</p><div class="track"><div id="badSlider" tabindex="0" class="thumb focusable" style="left:40%"></div></div><p id="badVal">Selected budget: $550</p></div><div class="card"><h3>Storage allowance</h3><div class="track"><div id="goodSlider" tabindex="0" role="slider" aria-label="Storage allowance" aria-valuemin="10" aria-valuemax="100" aria-valuenow="60" aria-valuetext="60 gigabytes" class="thumb focusable" style="left:55%"></div></div><p id="goodVal">Storage allowance: 60 GB</p></div><div class="card"><h3>Support hours</h3><div class="track"><div id="partialSlider" tabindex="0" role="slider" aria-label="Support hours" aria-valuemin="1" aria-valuemax="20" class="thumb focusable" style="left:30%"></div></div><p id="partialVal">Support hours: 7 per month</p></div><p class="status">Use Left and Right Arrow keys on each slider.</p></main><footer><a href="tester-reference.html">Tester reference</a></footer><script>function slider(id,out,min,max,start,suffix,good){let el=document.getElementById(id),v=start;el.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();v=Math.max(min,Math.min(max,v+(e.key==='ArrowRight'?1:-1)));document.getElementById(out).textContent=suffix(v);el.style.left=((v-min)/(max-min)*90)+'%';if(good){el.setAttribute('aria-valuenow',v);el.setAttribute('aria-valuetext',suffix(v).split(': ').pop())}}})}slider('badSlider','badVal',250,1000,550,v=>'Selected budget: $'+v,false);slider('goodSlider','goodVal',10,100,60,v=>'Storage allowance: '+v+' GB',true);slider('partialSlider','partialVal',1,20,7,v=>'Support hours: '+v+' per month',false);</script></body></html>
